<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CapCut Mobile Studio - Trình Dựng Video Điện Thoại</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0c10; color: #f1f5f9; overflow-x: hidden; touch-action: manipulation; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #12141c; }
    ::-webkit-scrollbar-thumb { background: #2d3142; border-radius: 4px; }
    input[type="range"] { accent-color: #00e5ff; height: 6px; }
    .capcut-gradient { background: linear-gradient(135deg, #00e5ff 0%, #7c3aed 100%); }
    .timeline-grid {
      background-size: 40px 100%;
      background-image: linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px);
    }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 12px); }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-[#0b0c10] text-slate-100 overflow-hidden select-none">

  <!-- TOP HEADER -->
  <header class="h-12 bg-[#141620] border-b border-slate-800/80 px-2.5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg capcut-gradient flex items-center justify-center font-black text-slate-950 text-xs shadow">
        CC
      </div>
      <input id="projectTitleInput" type="text" value="Video TikTok #01" class="w-28 sm:w-36 bg-transparent text-xs font-bold text-white focus:outline-none focus:bg-slate-800 px-1 py-0.5 rounded border border-transparent focus:border-cyan-400 truncate" />
    </div>

    <!-- Aspect Ratio Toggle -->
    <div class="flex items-center bg-[#0d0f17] p-0.5 rounded-lg border border-slate-800 text-[11px]">
      <button id="ratio916Btn" class="px-2 py-0.5 rounded bg-cyan-500 text-slate-950 font-bold transition">9:16</button>
      <button id="ratio169Btn" class="px-2 py-0.5 rounded text-slate-400 hover:text-white transition">16:9</button>
      <button id="ratio11Btn" class="px-2 py-0.5 rounded text-slate-400 hover:text-white transition">1:1</button>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-1.5">
      <label for="uploadVideoInput" class="cursor-pointer bg-slate-800 active:bg-slate-700 text-slate-200 text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1">
        <span>+ Video</span>
      </label>
      <input id="uploadVideoInput" type="file" accept="video/*" class="hidden" />

      <button id="openRenderModalBtn" class="capcut-gradient active:opacity-90 text-slate-950 font-bold text-xs px-2.5 py-1.5 rounded-lg shadow flex items-center gap-1">
        <span>Xuất</span>
      </button>
    </div>
  </header>

  <!-- CENTER VIDEO PREVIEW MONITOR -->
  <main class="flex-1 flex flex-col items-center justify-center p-2 relative min-h-0 bg-black overflow-hidden">
    <div id="canvasWrapper" class="relative max-h-full max-w-full flex items-center justify-center rounded-lg overflow-hidden border border-slate-800 shadow-2xl">
      <canvas id="previewCanvas" width="405" height="720" class="max-h-[46vh] sm:max-h-[50vh] w-auto block touch-none cursor-pointer"></canvas>
    </div>

    <!-- Floating Help Badge -->
    <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-2 py-1 rounded text-[10px] text-cyan-300 border border-cyan-500/20 pointer-events-none">
      💡 Chạm & kéo trên màn hình để dời Logo / Nhãn dán
    </div>
  </main>

  <!-- TRANSPORT CONTROLS & TIMELINE -->
  <div class="bg-[#12141e] border-t border-slate-800/80 px-3 py-1.5 shrink-0 z-20">
    <div class="flex items-center justify-between mb-1">
      <div class="flex items-center gap-2">
        <button id="stepBackBtn" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 text-xs flex items-center justify-center font-bold active:bg-slate-700">
          -1s
        </button>
        <button id="playPauseBtn" class="w-10 h-10 rounded-full capcut-gradient text-slate-950 font-black text-sm flex items-center justify-center shadow-lg active:scale-95 transition">
          ▶
        </button>
        <button id="stepForwardBtn" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 text-xs flex items-center justify-center font-bold active:bg-slate-700">
          +1s
        </button>
        <span id="timecodeDisplay" class="text-xs font-mono text-cyan-400 ml-1">00:00.0 / 00:12.0</span>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="quickSplitBtn" class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs px-2.5 py-1.5 rounded-lg font-semibold active:bg-amber-500/30 flex items-center gap-1">
          <span>✂️ Tách</span>
        </button>
        <button id="deleteClipBtn" class="bg-rose-500/20 text-rose-300 border border-rose-500/40 text-xs px-2 py-1.5 rounded-lg font-semibold active:bg-rose-500/30">
          🗑️ Xoá
        </button>
      </div>
    </div>

    <!-- Mini Touch-Scrub Timeline Strip -->
    <div id="timelineScrollArea" class="h-10 bg-[#0a0c13] rounded-lg border border-slate-800 overflow-x-auto overflow-y-hidden relative timeline-grid cursor-pointer touch-pan-x">
      <div id="timelineInner" class="relative h-full" style="width: 800px;">
        <div id="miniTrackClips" class="absolute inset-0 flex items-center px-1"></div>
        <div id="playheadLine" class="absolute top-0 bottom-0 w-0.5 bg-rose-500 pointer-events-none z-10" style="left: 0px;">
          <div class="w-2.5 h-2.5 bg-rose-500 rotate-45 -ml-[4px] -mt-0.5 rounded-sm"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM DRAWER SHEET -->
  <div id="toolDrawer" class="bg-[#171926] border-t border-slate-700/80 flex flex-col shrink-0 max-h-52 min-h-36 overflow-y-auto p-2.5 relative transition-all duration-200">
    <div class="flex items-center justify-between pb-1.5 mb-1.5 border-b border-slate-800">
      <span id="drawerTitle" class="text-xs font-bold text-cyan-400 uppercase tracking-wide">✂️ Chỉnh Sửa & Tách Ghép Clip</span>
      <div class="flex items-center gap-2">
        <span id="drawerSubTitle" class="text-[11px] text-slate-400">2 clips</span>
        <button id="closeDrawerBtn" class="text-slate-400 hover:text-white px-2 text-xs">✕</button>
      </div>
    </div>

    <!-- TAB 1: MEDIA & EDIT -->
    <div id="drawer-media" class="drawer-content space-y-2 text-xs">
      <div class="flex gap-1.5 overflow-x-auto pb-1">
        <button id="addCyberSceneBtn" class="px-2.5 py-1.5 rounded bg-slate-800 active:bg-slate-700 border border-slate-700 whitespace-nowrap text-[11px]">+ Cảnh Neon</button>
        <button id="addNatureSceneBtn" class="px-2.5 py-1.5 rounded bg-slate-800 active:bg-slate-700 border border-slate-700 whitespace-nowrap text-[11px]">+ Cảnh Sóng</button>
        <button id="addStudioSceneBtn" class="px-2.5 py-1.5 rounded bg-slate-800 active:bg-slate-700 border border-slate-700 whitespace-nowrap text-[11px]">+ Cảnh Vlog</button>
        <button id="addIntroSceneBtn" class="px-2.5 py-1.5 rounded bg-slate-800 active:bg-slate-700 border border-slate-700 whitespace-nowrap text-[11px]">+ Cảnh Intro</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Chuyển cảnh giữa các Clip</label>
          <select id="transitionSelect" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-white">
            <option value="none">Cut thẳng</option>
            <option value="fade" selected>Mờ dần (Fade)</option>
            <option value="flash">Chớp sáng (Flash)</option>
            <option value="slide">Trượt ngang (Slide)</option>
            <option value="zoom">Thu phóng (Zoom)</option>
          </select>
        </div>
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Tốc độ phát: <span id="fxSpeedVal">1.0</span>x</label>
          <input id="fxSpeedInput" type="range" min="0.5" max="2.0" step="0.25" value="1.0" class="w-full" />
        </div>
      </div>
      <div id="mediaClipList" class="flex gap-1.5 overflow-x-auto pt-1"></div>
    </div>

    <!-- TAB 2: VIETSUB -->
    <div id="drawer-vietsub" class="drawer-content hidden space-y-2 text-xs">
      <div class="flex gap-1.5">
        <input id="subTextInput" type="text" placeholder="Nhập câu Vietsub..." value="Chào mừng bạn đến với CapCut Mobile!" class="flex-1 bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white" />
        <button id="addSubtitleBtn" class="bg-cyan-500 active:bg-cyan-400 text-slate-950 font-bold px-3 py-1.5 rounded text-xs">+ Thêm</button>
        <button id="autoVietsubBtn" class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 px-2 py-1.5 rounded text-[11px] whitespace-nowrap">✨ Mẫu AI</button>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Màu chữ</label>
          <input id="subColorInput" type="color" value="#ffea00" class="w-full h-6 bg-slate-800 border border-slate-700 rounded cursor-pointer" />
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Cỡ chữ: <span id="subSizeVal">24</span>px</label>
          <input id="subSizeInput" type="range" min="16" max="40" value="24" class="w-full" />
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Vị trí Y: <span id="subYVal">82</span>%</label>
          <input id="subYInput" type="range" min="20" max="92" value="82" class="w-full" />
        </div>
      </div>
      <div id="subtitlesList" class="space-y-1 max-h-20 overflow-y-auto"></div>
    </div>

    <!-- TAB 3: XOÁ LOGO -->
    <div id="drawer-delogo" class="drawer-content hidden space-y-2 text-xs">
      <div class="flex items-center justify-between">
        <label class="inline-flex items-center gap-1.5 cursor-pointer">
          <input id="delogoEnableToggle" type="checkbox" checked class="accent-cyan-400" />
          <span class="text-xs text-cyan-300 font-semibold">Bật Xoá Logo Watermark</span>
        </label>
        <div class="flex items-center gap-1">
          <button id="presetTopRightBtn" class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px]">Góc Phải</button>
          <button id="presetTopLeftBtn" class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px]">Góc Trái</button>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Thuật toán xoá</label>
          <select id="delogoModeSelect" class="w-full bg-slate-800 border border-slate-700 rounded p-1 text-xs text-white">
            <option value="inpaint" selected>Smart Inpaint (Nội suy mượt)</option>
            <option value="blur">Gaussian Blur (Làm mờ)</option>
            <option value="pixelate">Pixelate (Làm nhoè ô)</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Độ mạnh xoá: <span id="delogoStrengthVal">18</span>px</label>
          <input id="delogoStrengthInput" type="range" min="6" max="40" value="18" class="w-full" />
        </div>
      </div>
      <p class="text-[10px] text-slate-400">💡 Chạm ngón tay và kéo trực tiếp khung viền đỏ trên màn hình để đặt vị trí cần che logo.</p>
    </div>

    <!-- TAB 4: NHÃN DÁN -->
    <div id="drawer-stickers" class="drawer-content hidden space-y-2 text-xs">
      <div class="grid grid-cols-6 gap-1.5">
        <button data-sticker="🔥" class="sticker-btn text-xl p-1 bg-slate-800 rounded active:scale-110">🔥</button>
        <button data-sticker="😂" class="sticker-btn text-xl p-1 bg-slate-800 rounded active:scale-110">😂</button>
        <button data-sticker="❤️" class="sticker-btn text-xl p-1 bg-slate-800 rounded active:scale-110">❤️</button>
        <button data-sticker="👍" class="sticker-btn text-xl p-1 bg-slate-800 rounded active:scale-110">👍</button>
        <button data-sticker="🎉" class="sticker-btn text-xl p-1 bg-slate-800 rounded active:scale-110">🎉</button>
        <button data-sticker="⚡" class="sticker-btn text-xl p-1 bg-slate-800 rounded active:scale-110">⚡</button>
        <button data-sticker="SUBSCRIBE 🔔" class="sticker-btn col-span-3 text-[10px] font-bold py-1 bg-red-600 rounded text-white">SUBSCRIBE 🔔</button>
        <button data-sticker="VIETSUB VIP 🇻🇳" class="sticker-btn col-span-3 text-[10px] font-bold py-1 bg-amber-500 rounded text-slate-950">VIETSUB VIP 🇻🇳</button>
      </div>
      <div id="stickersList" class="space-y-1 max-h-16 overflow-y-auto"></div>
    </div>

    <!-- TAB 5: HIỆU ỨNG -->
    <div id="drawer-effects" class="drawer-content hidden space-y-2 text-xs">
      <div class="flex gap-1.5 overflow-x-auto pb-1">
        <button data-vfx="none" class="vfx-btn px-2.5 py-1 rounded bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-semibold whitespace-nowrap text-[11px]">Mặc định</button>
        <button data-vfx="glitch" class="vfx-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200 whitespace-nowrap text-[11px]">⚡ Glitch</button>
        <button data-vfx="vhs" class="vfx-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200 whitespace-nowrap text-[11px]">📼 Retro VHS</button>
        <button data-vfx="shake" class="vfx-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200 whitespace-nowrap text-[11px]">💥 Shake</button>
        <button data-vfx="cinema" class="vfx-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200 whitespace-nowrap text-[11px]">🎬 Cinema</button>
        <button data-vfx="neon" class="vfx-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200 whitespace-nowrap text-[11px]">🔮 Cyberpunk</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Độ sáng (Brightness): <span id="fxBrightVal">100</span>%</label>
          <input id="fxBrightInput" type="range" min="50" max="150" value="100" class="w-full" />
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Bão hoà (Saturation): <span id="fxSatVal">100</span>%</label>
          <input id="fxSatInput" type="range" min="0" max="200" value="100" class="w-full" />
        </div>
      </div>
    </div>

    <!-- TAB 6: LỒNG GIỌNG -->
    <div id="drawer-voice" class="drawer-content hidden space-y-2 text-xs">
      <div class="flex gap-2">
        <button id="recordMicBtn" class="flex-1 py-2 px-2 rounded-lg bg-rose-600 active:bg-rose-500 text-white font-bold text-xs flex items-center justify-center gap-1.5">
          <span>🎙️ Thu Âm Micro</span>
        </button>
        <button id="addTtsBtn" class="flex-1 py-2 px-2 rounded-lg bg-cyan-500 active:bg-cyan-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-1.5">
          <span>🗣️ AI Đọc Tiếng Việt</span>
        </button>
      </div>
      <input id="ttsInput" type="text" value="Xin chào các bạn, hôm nay mình làm video cực chất!" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-white" />
      <div class="flex items-center gap-2">
        <button data-sfx="whoosh" class="sfx-btn flex-1 py-1 rounded bg-slate-800 border border-slate-700 text-[10px]">💨 Whoosh</button>
        <button data-sfx="ding" class="sfx-btn flex-1 py-1 rounded bg-slate-800 border border-slate-700 text-[10px]">🔔 Ding Pop</button>
        <button data-sfx="cyber" class="sfx-btn flex-1 py-1 rounded bg-slate-800 border border-slate-700 text-[10px]">⚡ Synth Beat</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="h-14 bg-[#10121a] border-t border-slate-800/90 flex items-center justify-around px-1 shrink-0 z-30 safe-bottom">
    <button data-tab="media" class="nav-tab-btn flex-1 py-1 flex flex-col items-center justify-center text-cyan-400 text-[10px] font-semibold">
      <span class="text-base">✂️</span>
      <span>Cắt ghép</span>
    </button>
    <button data-tab="vietsub" class="nav-tab-btn flex-1 py-1 flex flex-col items-center justify-center text-slate-400 text-[10px] font-medium">
      <span class="text-base">💬</span>
      <span>Vietsub</span>
    </button>
    <button data-tab="delogo" class="nav-tab-btn flex-1 py-1 flex flex-col items-center justify-center text-slate-400 text-[10px] font-medium">
      <span class="text-base">🪄</span>
      <span>Xoá Logo</span>
    </button>
    <button data-tab="stickers" class="nav-tab-btn flex-1 py-1 flex flex-col items-center justify-center text-slate-400 text-[10px] font-medium">
      <span class="text-base">✨</span>
      <span>Nhãn dán</span>
    </button>
    <button data-tab="effects" class="nav-tab-btn flex-1 py-1 flex flex-col items-center justify-center text-slate-400 text-[10px] font-medium">
      <span class="text-base">🔥</span>
      <span>Hiệu ứng</span>
    </button>
    <button data-tab="voice" class="nav-tab-btn flex-1 py-1 flex flex-col items-center justify-center text-slate-400 text-[10px] font-medium">
      <span class="text-base">🎙️</span>
      <span>Lồng tiếng</span>
    </button>
  </nav>

  <!-- RENDER MODAL -->
  <div id="renderModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#161925] border border-slate-700 rounded-xl w-full max-w-sm p-4 space-y-3 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-1.5">⚡ Xuất Video (.webm)</h3>
        <button id="closeRenderModalBtn" class="text-slate-400 p-1 text-sm">✕</button>
      </div>

      <div class="space-y-2 text-xs">
        <div class="flex justify-between text-slate-300">
          <span>Tiến độ Render:</span>
          <span id="renderStatusText" class="text-cyan-400 font-bold">Sẵn sàng</span>
        </div>
        <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
          <div id="renderProgressBar" class="h-full capcut-gradient w-0 transition-all duration-100"></div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-1">
        <button id="startRenderBtn" class="w-full capcut-gradient text-slate-950 font-extrabold text-xs py-2 rounded-lg shadow">
          🚀 Bắt Đầu Xuất Video
        </button>
        <a id="downloadRenderedLink" class="hidden w-full text-center bg-emerald-500 text-slate-950 font-extrabold text-xs py-2 rounded-lg shadow cursor-pointer">
          ⬇️ Tải Video Về Máy
        </a>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastBox" class="fixed top-14 left-1/2 -translate-x-1/2 bg-slate-900/90 border border-cyan-500/60 backdrop-blur-md text-white px-3.5 py-1.5 rounded-full shadow-xl text-xs font-medium opacity-0 pointer-events-none transition-opacity duration-300 z-50 whitespace-nowrap">
    Đã cập nhật!
  </div>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');

    const state = {
      isPlaying: false,
      currentTime: 0,
      pxPerSec: 40,
      aspectRatio: '9:16',
      selectedClipId: 'clip-1',
      transition: 'fade',
      vfx: 'none',
      color: { brightness: 100, saturation: 100, speed: 1.0 },
      delogo: { enabled: true, mode: 'inpaint', x: 68, y: 6, w: 28, h: 10, strength: 18 },
      subStyle: { color: '#ffea00', size: 24, yPercent: 82 },
      clips: [
        { id: 'clip-1', name: 'Intro Neon', type: 'procedural', theme: 'cyber', duration: 6.0, videoEl: null, trimOffset: 0 },
        { id: 'clip-2', name: 'Cảnh Sóng Biển', type: 'procedural', theme: 'ocean', duration: 6.0, videoEl: null, trimOffset: 0 }
      ],
      subtitles: [
        { id: 'sub-1', text: 'Chào mừng bạn đến với CapCut Mobile!', start: 0.2, end: 3.5 },
        { id: 'sub-2', text: 'Xoá logo & Vietsub cực nhanh trên điện thoại', start: 3.8, end: 7.2 },
        { id: 'sub-3', text: 'Bấm Xuất để tải video về máy nhé!', start: 7.5, end: 11.8 }
      ],
      stickers: [
        { id: 'stk-1', content: '🔥', x: 20, y: 15, size: 40, start: 0, end: 12 },
        { id: 'stk-2', content: 'VIETSUB VIP 🇻🇳', x: 25, y: 10, size: 20, start: 0, end: 12 }
      ],
      voiceTracks: [],
      bgmVolume: 60
    };

    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('opacity-0');
      box.classList.add('opacity-100');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.remove('opacity-100');
        box.classList.add('opacity-0');
      }, 2000);
    }

    function getTotalDuration() {
      const sum = state.clips.reduce((acc, c) => acc + c.duration, 0);
      return Math.max(sum, 1);
    }

    function getClipAtTime(t) {
      let acc = 0;
      for (let i = 0; i < state.clips.length; i++) {
        const c = state.clips[i];
        if (t >= acc && t <= acc + c.duration + 0.001) {
          return { clip: c, index: i, localTime: t - acc, clipStart: acc };
        }
        acc += c.duration;
      }
      const last = state.clips[state.clips.length - 1];
      return { clip: last, index: state.clips.length - 1, localTime: last ? last.duration : 0, clipStart: Math.max(0, acc - (last ? last.duration : 0)) };
    }

    function drawProceduralScene(targetCtx, w, h, theme, localTime, globalTime) {
      targetCtx.save();
      if (theme === 'cyber') {
        const grad = targetCtx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#090426');
        grad.addColorStop(0.5, '#2b094d');
        grad.addColorStop(1, '#050716');
        targetCtx.fillStyle = grad;
        targetCtx.fillRect(0, 0, w, h);

        const sunY = h * 0.45;
        const sunGrad = targetCtx.createLinearGradient(0, sunY - 60, 0, sunY + 60);
        sunGrad.addColorStop(0, '#ff007f');
        sunGrad.addColorStop(1, '#ffbe0b');
        targetCtx.fillStyle = sunGrad;
        targetCtx.beginPath();
        targetCtx.arc(w * 0.5, sunY, Math.min(w, h) * 0.28, 0, Math.PI * 2);
        targetCtx.fill();

        targetCtx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
        targetCtx.lineWidth = 1.5;
        const horizon = h * 0.55;
        for (let i = -6; i <= 6; i++) {
          targetCtx.beginPath();
          targetCtx.moveTo(w * 0.5 + i * 20, horizon);
          targetCtx.lineTo(w * 0.5 + i * 100, h);
          targetCtx.stroke();
        }
      } else if (theme === 'ocean') {
        const sky = targetCtx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#0f172a');
        sky.addColorStop(0.6, '#0284c7');
        targetCtx.fillStyle = sky;
        targetCtx.fillRect(0, 0, w, h);

        for (let layer = 0; layer < 3; layer++) {
          targetCtx.fillStyle = `rgba(56, 189, 248, ${0.25 + layer * 0.18})`;
          targetCtx.beginPath();
          const baseH = h * (0.6 + layer * 0.12);
          targetCtx.moveTo(0, h);
          for (let x = 0; x <= w; x += 15) {
            const waveY = baseH + Math.sin(x * 0.02 + globalTime * (2 + layer * 0.6)) * 14;
            targetCtx.lineTo(x, waveY);
          }
          targetCtx.lineTo(w, h);
          targetCtx.closePath();
          targetCtx.fill();
        }
      } else if (theme === 'vlog') {
        const bg = targetCtx.createLinearGradient(0, 0, w, h);
        bg.addColorStop(0, '#1e1b4b');
        bg.addColorStop(1, '#311042');
        targetCtx.fillStyle = bg;
        targetCtx.fillRect(0, 0, w, h);

        const bars = 16;
        const barW = (w * 0.8) / bars;
        const startX = w * 0.1;
        for (let i = 0; i < bars; i++) {
          const amp = Math.abs(Math.sin(globalTime * 4 + i * 0.5)) * (h * 0.3) + 12;
          targetCtx.fillStyle = i % 2 === 0 ? '#00e5ff' : '#a855f7';
          targetCtx.fillRect(startX + i * barW, h * 0.55 - amp / 2, barW - 4, amp);
        }
      } else {
        const bg = targetCtx.createLinearGradient(0, 0, w, h);
        bg.addColorStop(0, '#042f2e');
        bg.addColorStop(1, '#111827');
        targetCtx.fillStyle = bg;
        targetCtx.fillRect(0, 0, w, h);

        for (let i = 0; i < 8; i++) {
          const r = ((globalTime * 50 + i * 35) % (w * 0.5));
          targetCtx.strokeStyle = `rgba(45, 212, 191, ${1 - r / (w * 0.5)})`;
          targetCtx.lineWidth = 2.5;
          targetCtx.beginPath();
          targetCtx.arc(w / 2, h / 2, r, 0, Math.PI * 2);
          targetCtx.stroke();
        }
      }

      const logoX = w * 0.68;
      const logoY = h * 0.07;
      targetCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      targetCtx.font = `bold ${Math.round(w * 0.038)}px Inter, sans-serif`;
      targetCtx.fillText('🎵 TIKTOK @DEMO', logoX, logoY + 16);
      targetCtx.font = `${Math.round(w * 0.026)}px Inter, sans-serif`;
      targetCtx.fillStyle = 'rgba(0, 229, 255, 0.9)';
      targetCtx.fillText('WATERMARK LOGO', logoX, logoY + 30);

      targetCtx.restore();
    }

    function renderCurrentFrame() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const info = getClipAtTime(state.currentTime);
      const activeClip = info.clip;
      if (!activeClip) return;

      ctx.save();
      ctx.filter = `brightness(${state.color.brightness}%) saturate(${state.color.saturation}%)`;
      let shakeX = 0;
      let shakeY = 0;
      if (state.vfx === 'shake') {
        shakeX = Math.sin(state.currentTime * 35) * 6;
        shakeY = Math.cos(state.currentTime * 42) * 5;
      }
      ctx.translate(shakeX, shakeY);

      if (activeClip.type === 'video' && activeClip.videoEl && activeClip.videoEl.readyState >= 2) {
        const vw = activeClip.videoEl.videoWidth || w;
        const vh = activeClip.videoEl.videoHeight || h;
        const scale = Math.min(w / vw, h / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        ctx.drawImage(activeClip.videoEl, (w - dw) / 2, (h - dh) / 2, dw, dh);
      } else {
        drawProceduralScene(ctx, w, h, activeClip.theme || 'cyber', info.localTime, state.currentTime);
      }
      ctx.restore();

      if (info.index > 0 && info.localTime < 0.4 && state.transition !== 'none') {
        const p = info.localTime / 0.4;
        ctx.save();
        if (state.transition === 'fade') {
          ctx.fillStyle = `rgba(0, 0, 0, ${1 - p})`;
          ctx.fillRect(0, 0, w, h);
        } else if (state.transition === 'flash') {
          ctx.fillStyle = `rgba(255, 255, 255, ${(1 - p) * 0.9})`;
          ctx.fillRect(0, 0, w, h);
        }
        ctx.restore();
      }

      if (state.delogo.enabled) {
        const rx = Math.round((state.delogo.x / 100) * w);
        const ry = Math.round((state.delogo.y / 100) * h);
        const rw = Math.round((state.delogo.w / 100) * w);
        const rh = Math.round((state.delogo.h / 100) * h);
        const strength = state.delogo.strength;

        ctx.save();
        if (state.delogo.mode === 'inpaint') {
          const sampleY = Math.max(0, ry - 4);
          ctx.drawImage(canvas, rx, sampleY, rw, 4, rx, ry, rw, rh);
          ctx.globalAlpha = 0.55;
          const sampleX = Math.max(0, rx - 4);
          ctx.drawImage(canvas, sampleX, ry, 4, rh, rx, ry, rw, rh);
          ctx.globalAlpha = 1.0;
        } else if (state.delogo.mode === 'blur') {
          ctx.beginPath();
          ctx.rect(rx, ry, rw, rh);
          ctx.clip();
          ctx.filter = `blur(${Math.max(4, Math.round(strength / 2))}px)`;
          ctx.drawImage(canvas, 0, 0);
          ctx.filter = 'none';
        } else if (state.delogo.mode === 'pixelate') {
          const blockSize = Math.max(5, Math.round(strength / 2));
          const sw = Math.max(1, Math.floor(rw / blockSize));
          const sh = Math.max(1, Math.floor(rh / blockSize));
          offCanvas.width = sw;
          offCanvas.height = sh;
          offCtx.imageSmoothingEnabled = false;
          offCtx.drawImage(canvas, rx, ry, rw, rh, 0, 0, sw, sh);
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(offCanvas, 0, 0, sw, sh, rx, ry, rw, rh);
          ctx.imageSmoothingEnabled = true;
        }
        ctx.restore();

        if (!state.isRendering) {
          ctx.save();
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(rx, ry, rw, rh);
          ctx.fillStyle = 'rgba(244, 63, 94, 0.9)';
          ctx.font = 'bold 10px Inter, sans-serif';
          ctx.fillText('🪄 Vùng xoá logo', rx + 2, Math.max(12, ry - 4));
          ctx.restore();
        }
      }

      if (state.vfx === 'glitch') {
        ctx.save();
        const sliceH = 20;
        const sy = Math.floor((Math.sin(state.currentTime * 20) * 0.5 + 0.5) * (h - sliceH));
        ctx.drawImage(canvas, 0, sy, w, sliceH, 8, sy, w, sliceH);
        ctx.restore();
      } else if (state.vfx === 'cinema') {
        const barH = Math.round(h * 0.12);
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, barH);
        ctx.fillRect(0, h - barH, w, barH);
      }

      state.stickers.forEach(stk => {
        if (state.currentTime >= stk.start && state.currentTime <= stk.end) {
          ctx.save();
          const sx = (stk.x / 100) * w;
          const sy = (stk.y / 100) * h;
          ctx.translate(sx, sy);
          if (stk.content.length > 4) {
            ctx.font = `800 ${stk.size}px Inter, sans-serif`;
            const m = ctx.measureText(stk.content);
            ctx.fillStyle = 'rgba(225, 29, 72, 0.92)';
            ctx.beginPath();
            ctx.roundRect(-m.width / 2 - 8, -stk.size / 2 - 6, m.width + 16, stk.size + 12, 6);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(stk.content, 0, 1);
          } else {
            ctx.font = `${stk.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(stk.content, 0, 0);
          }
          ctx.restore();
        }
      });

      const activeSubs = state.subtitles.filter(s => state.currentTime >= s.start && state.currentTime <= s.end);
      activeSubs.forEach((sub) => {
        ctx.save();
        const fontSize = state.subStyle.size;
        ctx.font = `700 ${fontSize}px Inter, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const textX = w / 2;
        const textY = (state.subStyle.yPercent / 100) * h;
        const metrics = ctx.measureText(sub.text);
        const boxW = metrics.width + 20;
        const boxH = fontSize + 14;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.beginPath();
        ctx.roundRect(textX - boxW / 2, textY - boxH / 2, boxW, boxH, 6);
        ctx.fill();

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000000';
        ctx.strokeText(sub.text, textX, textY);

        ctx.fillStyle = state.subStyle.color;
        ctx.fillText(sub.text, textX, textY);
        ctx.restore();
      });
    }

    let isDragging = false;
    let dragTarget = null;

    function handlePointerDown(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const mx = ((clientX - rect.left) / rect.width) * 100;
      const my = ((clientY - rect.top) / rect.height) * 100;

      if (state.delogo.enabled) {
        if (mx >= state.delogo.x && mx <= state.delogo.x + state.delogo.w &&
            my >= state.delogo.y && my <= state.delogo.y + state.delogo.h) {
          isDragging = true;
          dragTarget = 'delogo';
          return;
        }
      }

      for (let i = state.stickers.length - 1; i >= 0; i--) {
        const stk = state.stickers[i];
        if (state.currentTime >= stk.start && state.currentTime <= stk.end) {
          if (Math.abs(mx - stk.x) < 14 && Math.abs(my - stk.y) < 14) {
            isDragging = true;
            dragTarget = stk;
            return;
          }
        }
      }
    }

    function handlePointerMove(clientX, clientY) {
      if (!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const mx = Math.max(0, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
      const my = Math.max(0, Math.min(95, ((clientY - rect.top) / rect.height) * 100));

      if (dragTarget === 'delogo') {
        state.delogo.x = Math.round(Math.max(0, Math.min(100 - state.delogo.w, mx - state.delogo.w / 2)));
        state.delogo.y = Math.round(Math.max(0, Math.min(100 - state.delogo.h, my - state.delogo.h / 2)));
        renderCurrentFrame();
      } else if (typeof dragTarget === 'object' && dragTarget) {
        dragTarget.x = Math.round(mx);
        dragTarget.y = Math.round(my);
        renderCurrentFrame();
      }
    }

    function handlePointerUp() {
      isDragging = false;
      dragTarget = null;
    }

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
    window.addEventListener('touchend', handlePointerUp);

    canvas.addEventListener('mousedown', (e) => handlePointerDown(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handlePointerUp);

    let lastTs = null;
    let animId = null;

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1).padStart(4, '0');
      return `${String(m).padStart(2, '0')}:${s}`;
    }

    function updatePlayhead() {
      const line = document.getElementById('playheadLine');
      line.style.left = `${state.currentTime * state.pxPerSec}px`;
      document.getElementById('timecodeDisplay').textContent = `${formatTime(state.currentTime)} / ${formatTime(getTotalDuration())}`;
    }

    function playbackStep(ts) {
      if (!state.isPlaying) return;
      if (!lastTs) lastTs = ts;
      const dt = ((ts - lastTs) / 1000) * state.color.speed;
      lastTs = ts;

      state.currentTime += dt;
      if (state.currentTime >= getTotalDuration()) {
        state.currentTime = 0;
        pauseVideo();
        renderCurrentFrame();
        updatePlayhead();
        return;
      }

      renderCurrentFrame();
      updatePlayhead();
      animId = requestAnimationFrame(playbackStep);
    }

    function playVideo() {
      state.isPlaying = true;
      lastTs = null;
      document.getElementById('playPauseBtn').textContent = '⏸';
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(playbackStep);
    }

    function pauseVideo() {
      state.isPlaying = false;
      document.getElementById('playPauseBtn').textContent = '▶';
      if (animId) cancelAnimationFrame(animId);
    }

    document.getElementById('playPauseBtn').addEventListener('click', () => {
      if (state.isPlaying) pauseVideo();
      else playVideo();
    });

    document.getElementById('stepBackBtn').addEventListener('click', () => {
      pauseVideo();
      state.currentTime = Math.max(0, state.currentTime - 1);
      renderCurrentFrame();
      updatePlayhead();
    });
    document.getElementById('stepForwardBtn').addEventListener('click', () => {
      pauseVideo();
      state.currentTime = Math.min(getTotalDuration(), state.currentTime + 1);
      renderCurrentFrame();
      updatePlayhead();
    });

    function splitCurrentClip() {
      const info = getClipAtTime(state.currentTime);
      if (!info.clip) return;
      if (info.localTime < 0.4 || info.localTime > info.clip.duration - 0.4) {
        showToast('Kéo con trỏ vào giữa clip để tách!');
        return;
      }
      const orig = info.clip;
      const firstDur = Number(info.localTime.toFixed(2));
      const secondDur = Number((orig.duration - firstDur).toFixed(2));
      orig.duration = firstDur;

      const secondClip = {
        id: 'clip-' + Date.now(),
        name: orig.name + ' (2)',
        type: orig.type,
        theme: orig.theme,
        duration: secondDur,
        videoEl: orig.videoEl,
        trimOffset: (orig.trimOffset || 0) + firstDur
      };
      state.clips.splice(info.index + 1, 0, secondClip);
      state.selectedClipId = secondClip.id;
      renderAll();
      showToast('✂️ Đã tách clip thành công!');
    }
    document.getElementById('quickSplitBtn').addEventListener('click', splitCurrentClip);

    document.getElementById('deleteClipBtn').addEventListener('click', () => {
      if (state.clips.length <= 1) {
        showToast('Cần giữ lại ít nhất 1 clip!');
        return;
      }
      state.clips = state.clips.filter(c => c.id !== state.selectedClipId);
      state.selectedClipId = state.clips[0].id;
      state.currentTime = Math.min(state.currentTime, getTotalDuration());
      renderAll();
      showToast('🗑️ Đã xoá clip!');
    });

    function setRatio(ratio, w, h, activeId) {
      state.aspectRatio = ratio;
      canvas.width = w;
      canvas.height = h;
      ['ratio916Btn', 'ratio169Btn', 'ratio11Btn'].forEach(id => {
        const b = document.getElementById(id);
        if (id === activeId) {
          b.className = 'px-2 py-0.5 rounded bg-cyan-500 text-slate-950 font-bold transition';
        } else {
          b.className = 'px-2 py-0.5 rounded text-slate-400 hover:text-white transition';
        }
      });
      renderCurrentFrame();
      showToast(`Đã đổi khung hình ${ratio}`);
    }
    document.getElementById('ratio916Btn').addEventListener('click', () => setRatio('9:16', 405, 720, 'ratio916Btn'));
    document.getElementById('ratio169Btn').addEventListener('click', () => setRatio('16:9', 720, 405, 'ratio169Btn'));
    document.getElementById('ratio11Btn').addEventListener('click', () => setRatio('1:1', 540, 540, 'ratio11Btn'));

    document.getElementById('uploadVideoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const vid = document.createElement('video');
      vid.src = url;
      vid.playsInline = true;
      vid.preload = 'auto';
      vid.addEventListener('loadedmetadata', () => {
        const dur = Math.min(30, Math.max(2, Number((vid.duration || 6).toFixed(1))));
        const newClip = {
          id: 'clip-' + Date.now(),
          name: file.name.slice(0, 16),
          type: 'video',
          theme: 'cyber',
          duration: dur,
          videoEl: vid,
          trimOffset: 0
        };
        state.clips.push(newClip);
        state.selectedClipId = newClip.id;
        renderAll();
        showToast(`🎬 Đã tải video "${file.name.slice(0, 12)}..."`);
      });
    });

    function addClip(name, theme) {
      const c = { id: 'clip-' + Date.now(), name, type: 'procedural', theme, duration: 5.0, videoEl: null, trimOffset: 0 };
      state.clips.push(c);
      state.selectedClipId = c.id;
      renderAll();
      showToast(`+ Đã ghép "${name}"`);

    document.getElementById('addCyberSceneBtn').addEventListener('click', () => addClip('Neon', 'cyber'));

    document.getElementById('presetTopRightBtn').addEventListener('click', () => {

    document.getElementById('presetTopLeftBtn').addEventListener('click', () => {
      state.delogo.x = 6; state.delogo.y = 6;
      renderCurrentFrame();
      showToast('Đặt vùng xoá góc trên trái');
    });

    document.querySelectorAll('.sticker-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const content = btn.getAttribute('data-sticker');
        const st = Number(state.currentTime.toFixed(1));
        state.stickers.push({
          id: 'stk-' + Date.now(),
          content,
          x: 35 + Math.floor(Math.random() * 30),
          y: 30 + Math.floor(Math.random() * 30),
          size: content.length > 4 ? 20 : 40,
          start: st,
          end: Math.min(getTotalDuration(), st + 5)
        });
        renderAll();
        showToast(`✨ Đã chèn ${content}`);
      });
    });

    document.querySelectorAll('.vfx-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.vfx = btn.getAttribute('data-vfx');
        document.querySelectorAll('.vfx-btn').forEach(b => {
          b.className = 'vfx-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200 whitespace-nowrap text-[11px]';
        });
        btn.className = 'vfx-btn px-2.5 py-1 rounded bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-semibold whitespace-nowrap text-[11px]';
        renderCurrentFrame();
        showToast(`Hiệu ứng: ${btn.textContent}`);
      });
    });

    document.getElementById('fxBrightInput').addEventListener('input', (e) => {
      state.color.brightness = parseInt(e.target.value, 10);
      document.getElementById('fxBrightVal').textContent = state.color.brightness;
      renderCurrentFrame();
    });
    document.getElementById('fxSatInput').addEventListener('input', (e) => {
      state.color.saturation = parseInt(e.target.value, 10);
      document.getElementById('fxSatVal').textContent = state.color.saturation;
      renderCurrentFrame();
    });
    document.getElementById('fxSpeedInput').addEventListener('input', (e) => {
      state.color.speed = parseFloat(e.target.value);
      document.getElementById('fxSpeedVal').textContent = state.color.speed;
    });

    let isRecMic = false;
    document.getElementById('recordMicBtn').addEventListener('click', () => {
      const btn = document.getElementById('recordMicBtn');
      if (!isRecMic) {
        isRecMic = true;
        btn.classList.replace('bg-rose-600', 'bg-amber-500');
        btn.textContent = '⏹ Dừng Thu & Lưu';
        showToast('🎙️ Đang thu âm giọng đọc...');
      } else {
        isRecMic = false;
        btn.classList.replace('bg-amber-500', 'bg-rose-600');
        btn.textContent = '🎙️ Thu Âm Micro';
        showToast('✅ Đã lưu giọng thu âm vào timeline!');
      }
    });

    document.getElementById('addTtsBtn').addEventListener('click', () => {
      const txt = document.getElementById('ttsInput').value.trim();
      if (!txt) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(txt);
        utter.lang = 'vi-VN';
        window.speechSynthesis.speak(utter);
      }
      showToast('🗣️ Đã đọc lồng tiếng AI!');
    });

    let audioCtx = null;
    function playSfx(type) {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.15, now);

      if (type === 'ding') {
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.3);
      } else {
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.3);
      }
    }
    document.querySelectorAll('.sfx-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        playSfx(btn.getAttribute('data-sfx'));
        showToast(`Âm thanh: ${btn.textContent}`);
      });
    });

    function renderAll() {
      const tot = getTotalDuration();
      document.getElementById('drawerSubTitle').textContent = `${state.clips.length} clips`;
      document.getElementById('timecodeDisplay').textContent = `${formatTime(state.currentTime)} / ${formatTime(tot)}`;

      const trackClips = document.getElementById('miniTrackClips');
      trackClips.innerHTML = '';
      const totalW = Math.max(700, (tot + 2) * state.pxPerSec);
      document.getElementById('timelineInner').style.width = `${totalW}px`;

      state.clips.forEach(clip => {
        const w = clip.duration * state.pxPerSec;
        const isSel = clip.id === state.selectedClipId;
        const el = document.createElement('div');
        el.className = `h-7 rounded border text-[10px] px-2 flex items-center justify-between font-semibold truncate shrink-0 cursor-pointer ${isSel ? 'bg-cyan-500 text-slate-950 border-white' : 'bg-slate-800 text-slate-300 border-slate-700'}`;
        el.style.width = `${w}px`;
        el.textContent = clip.name;
        el.addEventListener('click', () => {
          state.selectedClipId = clip.id;
          renderAll();
        });
        trackClips.appendChild(el);
      });

      const mediaList = document.getElementById('mediaClipList');
      mediaList.innerHTML = '';
      state.clips.forEach(clip => {
        const isSel = clip.id === state.selectedClipId;
        const b = document.createElement('div');
        b.className = `px-2 py-1 rounded text-[11px] whitespace-nowrap border cursor-pointer ${isSel ? 'bg-cyan-500/20 border-cyan-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`;
        b.textContent = `${clip.name} (${clip.duration}s)`;
        b.addEventListener('click', () => {
          state.selectedClipId = clip.id;
          renderAll();
        });
        mediaList.appendChild(b);
      });

      const subList = document.getElementById('subtitlesList');
      subList.innerHTML = '';
      state.subtitles.forEach(s => {
        const row = document.createElement('div');
        row.className = 'p-1.5 rounded bg-slate-800/80 border border-slate-700 text-[11px] flex justify-between items-center';
        row.innerHTML = `<span class="truncate text-amber-300">"${s.text}"</span><button data-del-sub="${s.id}" class="text-rose-400 px-1">✕</button>`;
        subList.appendChild(row);
      });
      subList.querySelectorAll('[data-del-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.subtitles = state.subtitles.filter(s => s.id !== btn.getAttribute('data-del-sub'));
          renderAll();
        });
      });

      const stkList = document.getElementById('stickersList');
      stkList.innerHTML = '';
      state.stickers.forEach(stk => {
        const row = document.createElement('div');
        row.className = 'p-1 rounded bg-slate-800/80 border border-slate-700 text-[10px] flex justify-between items-center';
        row.innerHTML = `<span>Nhãn: <strong>${stk.content}</strong></span><button data-del-stk="${stk.id}" class="text-rose-400 px-1">✕</button>`;
        stkList.appendChild(row);
      });
      stkList.querySelectorAll('[data-del-stk]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.stickers = state.stickers.filter(s => s.id !== btn.getAttribute('data-del-stk'));
          renderAll();
        });
      });

      renderCurrentFrame();
      updatePlayhead();
    }

    const timelineArea = document.getElementById('timelineScrollArea');
    const timelineInner = document.getElementById('timelineInner');
    let isScrubbing = false;

    function scrub(clientX) {
      const rect = timelineInner.getBoundingClientRect();
      const clickX = Math.max(0, clientX - rect.left);
      state.currentTime = Math.min(getTotalDuration(), Number((clickX / state.pxPerSec).toFixed(2)));
      renderCurrentFrame();
      updatePlayhead();
    }

    timelineArea.addEventListener('touchstart', (e) => {
      pauseVideo();
      isScrubbing = true;
      if (e.touches.length > 0) scrub(e.touches[0].clientX);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (isScrubbing && e.touches.length > 0) scrub(e.touches[0].clientX);
    }, { passive: true });
    window.addEventListener('touchend', () => isScrubbing = false);

    timelineArea.addEventListener('mousedown', (e) => {
      pauseVideo();
      isScrubbing = true;
      scrub(e.clientX);
    });
    window.addEventListener('mousemove', (e) => {
      if (isScrubbing) scrub(e.clientX);
    });
    window.addEventListener('mouseup', () => isScrubbing = false);

    const renderModal = document.getElementById('renderModal');
    document.getElementById('openRenderModalBtn').addEventListener('click', () => {
      pauseVideo();
      renderModal.classList.remove('hidden');
      document.getElementById('renderStatusText').textContent = 'Sẵn sàng';
      document.getElementById('renderProgressBar').style.width = '0%';
      document.getElementById('downloadRenderedLink').classList.add('hidden');
      document.getElementById('startRenderBtn').classList.remove('hidden');
    });
    document.getElementById('closeRenderModalBtn').addEventListener('click', () => {
      renderModal.classList.add('hidden');
    });

    document.getElementById('startRenderBtn').addEventListener('click', () => {
      const tot = getTotalDuration();
      const statusEl = document.getElementById('renderStatusText');
      const barEl = document.getElementById('renderProgressBar');
      const dlLink = document.getElementById('downloadRenderedLink');
      const startBtn = document.getElementById('startRenderBtn');

      state.isRendering = true;
      state.currentTime = 0;
      let recorder = null;
      let chunks = [];

      try {
        const stream = canvas.captureStream(30);
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          state.isRendering = false;
          const blob = new Blob(chunks, { type: 'video/webm' });
          dlLink.href = URL.createObjectURL(blob);
          dlLink.download = `${(document.getElementById('projectTitleInput').value || 'capcut_mobile').replace(/\s+/g, '_')}.webm`;
          dlLink.classList.remove('hidden');
          startBtn.classList.add('hidden');
          statusEl.textContent = '✅ Đã render xong!';
          renderCurrentFrame();
          showToast('🎉 Xuất video hoàn tất!');
        };
        recorder.start();
      } catch (err) {
        recorder = null;
      }

      statusEl.textContent = 'Đang render...';
      const step = 0.08;
      const interval = setInterval(() => {
        state.currentTime += step * 2;
        const pct = Math.min(100, Math.round((state.currentTime / tot) * 100));
        barEl.style.width = `${pct}%`;
        statusEl.textContent = `${pct}%`;
        renderCurrentFrame();
        updatePlayhead();

        if (state.currentTime >= tot) {
          clearInterval(interval);
          state.currentTime = 0;
          state.isRendering = false;
          if (recorder && recorder.state !== 'inactive') {
            recorder.stop();
          } else {
            statusEl.textContent = '✅ Đã render xong!';
            renderCurrentFrame();
          }
        }
      }, 35);
    });

    window.addEventListener('load', () => {
      renderAll();
    });
  </script>
</body>
</html>
